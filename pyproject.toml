[project]
name = "rune-workspace"
version = "2.1.0"

[tool.bumpver]
current_version = "2.1.0"
version_pattern = "MAJOR.MINOR.PATCH"
commit = false
tag = false
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"',
]
"apps/rune-cli/pyproject.toml" = [
    'version = "{version}"',
]
