name: Tag & Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag-release:
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"
    uses: aurumorcom/.github/.github/workflows/tag-release.yaml@main
    secrets:
      RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
